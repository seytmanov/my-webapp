<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Telegram mavzusiga qarab fon rangini o'zgartirish */
            background-color: var(--tg-theme-bg-color, #f0f2f5);
            color: var(--tg-theme-text-color, #222);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 85%;
            max-width: 320px;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 22px;
        }
        p {
            color: var(--tg-theme-hint-color, #777);
            font-size: 14px;
            margin-bottom: 25px;
        }
        button {
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active {
            transform: scale(0.96);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Xush kelibsiz! 🚀</h2>
        <p>Bu Telegram Web App uchun tayyorlangan maxsus va qulay interfeys.</p>
        <button id="sendBtn">Ma'lumot yuborish</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.ready(); 

        document.getElementById("sendBtn").addEventListener("click", () => {
            tg.sendData("Yangi dizayndagi tugma bosildi! ✅"); 
            tg.close();
        });
    </script>
</body>
</html>
